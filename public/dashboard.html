<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<title>Console — G4F Relay</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Grotesk:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --pink:#ff3aa3;--lime:#a3e635;--cyan:#27e1ff;
    --purple:#7b3aff;--gold:#fbbf24;--red:#ff5c6c;
    --surface:rgba(16,18,32,0.82);--line:rgba(255,255,255,0.10);--line-2:rgba(255,255,255,0.18);
    --ink:#f5f7fa;--ink-dim:rgba(255,255,255,0.72);--ink-muted:rgba(255,255,255,0.50);--ink-faint:rgba(255,255,255,0.32);
    --pixel:'Press Start 2P',monospace;--sans:'Space Grotesk',system-ui,sans-serif;--mono:'Geist Mono',ui-monospace,monospace;
  }

  * { box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0; font-family:var(--sans); color:var(--ink);
    background:#0a0814;
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:20px; position:relative; overflow:hidden;
  }

  /* ── Background: radial glows + scrolling grid floor ── */
  .bg{
    position:fixed; inset:0; pointer-events:none; z-index:0;
    background:
      radial-gradient(ellipse 80% 60% at 18% 20%, rgba(255,58,163,.18) 0%, transparent 55%),
      radial-gradient(ellipse 70% 60% at 88% 85%, rgba(123,58,255,.20) 0%, transparent 55%),
      radial-gradient(ellipse 60% 50% at 50% 110%, rgba(39,225,255,.16) 0%, transparent 60%),
      #0a0814;
  }
  .grid-floor{
    position:fixed; left:0; right:0; bottom:-10vh; height:55vh; pointer-events:none; z-index:1;
    background-image:
      linear-gradient(rgba(255,58,163,.18) 1px, transparent 1px),
      linear-gradient(90deg, rgba(39,225,255,.18) 1px, transparent 1px);
    background-size:80px 80px;
    transform:perspective(700px) rotateX(60deg); transform-origin:50% 0%;
    mask-image:linear-gradient(to bottom, transparent 0%, black 30%, black 100%);
    -webkit-mask-image:linear-gradient(to bottom, transparent 0%, black 30%, black 100%);
    animation:grid-scroll 8s linear infinite;
  }
  @keyframes grid-scroll{ from{background-position:0 0} to{background-position:0 80px} }
  .scanlines{
    position:fixed; inset:0; pointer-events:none; z-index:3;
    background:repeating-linear-gradient(to bottom, rgba(255,255,255,.02) 0 1px, transparent 1px 3px);
  }

  /* ── Card ── */
  .card{
    position:relative; z-index:4; width:100%; max-width:360px;
    background:var(--surface); border:2px solid var(--line); border-radius:14px;
    padding:24px 22px 22px; overflow:hidden;
    backdrop-filter:blur(20px) saturate(140%); -webkit-backdrop-filter:blur(20px) saturate(140%);
    box-shadow:0 20px 50px rgba(0,0,0,.5);
  }
  .card::before{
    content:""; position:absolute; top:0; left:0; right:0; height:3px;
    background:linear-gradient(90deg,var(--pink),var(--lime),var(--cyan),var(--pink));
    background-size:200% 100%; animation:rainbow 5s linear infinite;
  }
  @keyframes rainbow{ from{background-position:0% 0} to{background-position:200% 0} }

  h1{
    font-family:var(--pixel); font-size:12px; margin:6px 0 16px; text-align:center;
    color:#fff; text-shadow:2px 2px 0 var(--pink), 4px 4px 0 rgba(0,0,0,.4);
    letter-spacing:.02em; line-height:1.6;
  }

  /* ── Status pill + timer ── */
  .status-row{ display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; }
  .status-pill{
    display:inline-flex; align-items:center; gap:7px; padding:6px 12px; border-radius:99px;
    font-family:var(--pixel); font-size:8px; letter-spacing:.10em;
  }
  .status-pill .dot{ width:6px; height:6px; border-radius:50%; flex-shrink:0; }
  .status-pill.online{ background:rgba(163,230,53,.12); color:var(--lime); }
  .status-pill.online .dot{ background:var(--lime); box-shadow:0 0 8px var(--lime); animation:blink 1.4s infinite; }
  .status-pill.offline{ background:rgba(255,255,255,.05); color:var(--ink-muted); }
  .status-pill.offline .dot{ background:var(--ink-faint); }
  @keyframes blink{ 50%{opacity:.35} }

  .time{
    font-family:var(--mono); font-size:22px; font-weight:500; letter-spacing:.01em;
    margin:10px 0 4px; text-align:center;
  }
  .time .unit{ font-size:11px; color:var(--ink-muted); margin-left:6px; font-weight:400; }

  .banner{
    display:none; background:rgba(255,92,108,.10); border:1px solid rgba(255,92,108,.35);
    border-radius:9px; padding:11px 12px; font-family:var(--mono); font-size:11.5px;
    color:#ffb3bb; margin:14px 0; line-height:1.6; text-align:left;
  }
  .banner.show{ display:block; }
  .banner a{ color:var(--gold); }

  .extend-row{ text-align:center; margin:12px 0 4px; }
  .extend-btn{
    display:inline-flex; align-items:center; gap:6px;
    padding:10px 18px; border-radius:9px;
    font-family:var(--pixel); font-size:9px; letter-spacing:.08em;
    cursor:pointer; border:2px solid rgba(251,191,36,.45); color:var(--gold);
    background:rgba(251,191,36,.08);
    transition:all .15s;
  }
  .extend-btn:hover:not(:disabled){ border-color:var(--gold); background:rgba(251,191,36,.18); box-shadow:0 0 16px rgba(251,191,36,.35); }
  .extend-btn:active:not(:disabled){ transform:translateY(1px); }
  .extend-btn:disabled{ opacity:.4; cursor:not-allowed; transform:none; }

  /* ── Action buttons ── */
  .actions{ display:flex; flex-direction:column; gap:8px; margin-top:16px; }
  .pwr-btn{
    display:flex; align-items:center; justify-content:center; gap:8px;
    padding:12px; border-radius:9px; font-family:var(--pixel); font-size:9px;
    letter-spacing:.08em; cursor:pointer; border:2px solid; background:rgba(255,255,255,.03);
    transition:all .15s; color:var(--ink);
  }
  .pwr-btn:active{ transform:translateY(1px); }
  .pwr-btn:disabled{ opacity:.4; cursor:not-allowed; transform:none; }
  .pwr-start  { border-color:rgba(163,230,53,.45); color:var(--lime); }
  .pwr-start:hover:not(:disabled)  { border-color:var(--lime); background:rgba(163,230,53,.12); box-shadow:0 0 14px rgba(163,230,53,.3); }
  .pwr-restart{ border-color:rgba(39,225,255,.45); color:var(--cyan); }
  .pwr-restart:hover:not(:disabled){ border-color:var(--cyan); background:rgba(39,225,255,.10); box-shadow:0 0 14px rgba(39,225,255,.25); }
  .pwr-stop   { border-color:rgba(255,92,108,.45); color:var(--red); }
  .pwr-stop:hover:not(:disabled)   { border-color:var(--red); background:rgba(255,92,108,.12); box-shadow:0 0 14px rgba(255,92,108,.25); }

  #status{
    font-family:var(--mono); font-size:11.5px; color:var(--ink-muted);
    margin-top:14px; min-height:16px; text-align:center;
  }

  .logout-row{ text-align:center; margin-top:14px; }
  .logout-row button{
    background:none; border:none; color:var(--ink-faint); font-family:var(--mono);
    font-size:11px; cursor:pointer; text-decoration:underline; text-underline-offset:2px;
  }
  .logout-row button:hover{ color:var(--ink-muted); }

  footer{
    text-align:center; margin-top:16px; font-family:var(--mono); font-size:9.5px; color:var(--ink-faint);
  }

  /* ── Resurse (CPU / MEMORY / NETWORK) ── */
  .res-panel{ margin-top:16px; padding-top:14px; border-top:1px solid var(--line); display:none; }
  .res-panel.show{ display:block; }
  .res-panel-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .res-panel-title{ font-family:var(--pixel); font-size:8px; color:#fff; letter-spacing:.10em; }
  .res-live{ font-family:var(--mono); font-size:9px; color:var(--lime); }
  .res-row{ background:rgba(0,0,0,.25); border:1px solid var(--line); border-radius:8px; padding:8px 10px 6px; margin-bottom:8px; }
  .res-row:last-child{ margin-bottom:0; }
  .res-top{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:4px; }
  .res-label{ font-family:var(--pixel); font-size:7px; letter-spacing:.12em; }
  .res-val{ font-family:var(--mono); font-size:12px; font-weight:700; color:#fff; }
  .res-spark{ width:100%; height:26px; display:block; }

  /* ── Responsive: telefoane / ecrane inguste ── */
  @media (max-width: 480px){
    body{
      padding:12px;
      align-items:flex-start;
      overflow-y:auto;
    }
    .card{
      max-width:100%;
      padding:20px 16px 18px;
      border-radius:12px;
    }
    h1{ font-size:10.5px; margin:4px 0 14px; line-height:1.7; }
    .time{ font-size:19px; }
    .banner{ font-size:11px; padding:10px 10px; }
    .extend-btn{ width:100%; justify-content:center; padding:12px; font-size:8.5px; }
    .pwr-btn{ font-size:8.5px; padding:13px; }
    .status-pill{ font-size:7.5px; padding:6px 10px; }
    .res-panel-title, .res-label{ font-size:6.5px; }
    footer{ margin-top:12px; margin-bottom:8px; }
  }

  @media (max-width: 360px){
    h1{ font-size:9px; }
    .time{ font-size:17px; }
  }

  /* Evita zoom automat pe iOS la focus/tap si asigura tap targets confortabile */
  button{ -webkit-tap-highlight-color:transparent; touch-action:manipulation; }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="grid-floor"></div>
  <div class="scanlines"></div>

  <div class="card">
    <h1>Serverul Nicu<br>PalWorld</h1>

    <div class="status-row">
      <span class="status-pill offline" id="status-pill">
        <span class="dot"></span><span id="status-label">SE VERIFICA</span>
      </span>
    </div>

    <div class="time" id="remaining">--:--:--<span class="unit">ramase</span></div>

    <div class="banner" id="warn-banner">
      Mai sunt sub 30 de minute! Apasa butonul "+ 90 min" de mai jos pentru extindere automata.
    </div>

    <div class="extend-row" id="extend-row">
      <button class="extend-btn" id="extend-btn" onclick="extend()">+ 90 MIN (AUTO)</button>
    </div>

    <div class="actions">
      <button class="pwr-btn pwr-start" id="start" onclick="run('start')">PORNESTE</button>
      <button class="pwr-btn pwr-restart" id="restart" onclick="run('restart')" style="display:none;">RESTART</button>
      <button class="pwr-btn pwr-stop" id="stop" onclick="run('stop')" style="display:none;">OPRESTE</button>
    </div>

    <div id="status"></div>

    <div class="res-panel" id="res-panel">
      <div class="res-panel-head">
        <span class="res-panel-title">RESOURCES</span>
        <span class="res-live">LIVE</span>
      </div>
      <div class="res-row">
        <div class="res-top">
          <span class="res-label" style="color:var(--lime)">CPU</span>
          <span class="res-val" id="res-cpu">—</span>
        </div>
        <svg class="res-spark" id="spark-cpu" viewBox="0 0 200 26" preserveAspectRatio="none"></svg>
      </div>
      <div class="res-row">
        <div class="res-top">
          <span class="res-label" style="color:var(--cyan)">MEMORY</span>
          <span class="res-val" id="res-memory">—</span>
        </div>
        <svg class="res-spark" id="spark-memory" viewBox="0 0 200 26" preserveAspectRatio="none"></svg>
      </div>
      <div class="res-row">
        <div class="res-top">
          <span class="res-label" style="color:var(--pink)">NETWORK</span>
          <span class="res-val" id="res-network" style="font-size:10px">—</span>
        </div>
        <svg class="res-spark" id="spark-network" viewBox="0 0 200 26" preserveAspectRatio="none"></svg>
      </div>
    </div>

    <div class="logout-row">
      <form method="POST" action="/logout" style="display:inline;">
        <button type="submit">Iesire</button>
      </form>
    </div>
  </div>

  <footer>g4f-relay</footer>

<script>
let localSeconds = null;
let isOnline = false;

function formatHms(totalSeconds) {
  const s = Math.max(0, Math.floor(totalSeconds));
  const h = String(Math.floor(s / 3600)).padStart(2, '0');
  const m = String(Math.floor((s % 3600) / 60)).padStart(2, '0');
  const sec = String(s % 60).padStart(2, '0');
  return `${h}:${m}:${sec}`;
}

function renderRemaining() {
  const remainingEl = document.getElementById('remaining');
  const banner = document.getElementById('warn-banner');
  const pill = document.getElementById('status-pill');
  const label = document.getElementById('status-label');

  pill.classList.toggle('online', isOnline);
  pill.classList.toggle('offline', !isOnline);
  label.textContent = isOnline ? 'ACTIVE SESSION' : 'OFFLINE';

  document.getElementById('start').style.display   = isOnline ? 'none' : 'flex';
  document.getElementById('restart').style.display = isOnline ? 'flex' : 'none';
  document.getElementById('stop').style.display    = isOnline ? 'flex' : 'none';

  document.getElementById('extend-row').style.display = isOnline ? 'block' : 'none';

  if (localSeconds === null) {
    remainingEl.innerHTML = '--:--:--<span class="unit">ramase</span>';
    return;
  }

  remainingEl.innerHTML = `${formatHms(localSeconds)}<span class="unit">ramase</span>`;

  const warn = localSeconds < 1800;
  banner.classList.toggle('show', warn);
}

// Ceas local — scade cate o secunda
setInterval(() => {
  if (localSeconds !== null && localSeconds > 0) {
    localSeconds -= 1;
    renderRemaining();
  }
}, 1000);

async function run(action) {
  const buttons = document.querySelectorAll('#start,#restart,#stop');
  const statusEl = document.getElementById('status');
  buttons.forEach(b => b.disabled = true);
  statusEl.textContent = 'Se proceseaza...';
  try {
    const res = await fetch('/api/action/' + action, { method: 'POST' });
    const data = await res.json();
    statusEl.textContent = data.ok ? 'Comanda a fost trimisa.' : ('Eroare: ' + data.error);
    if (data.ok) setTimeout(checkStatus, 1500);
  } catch (e) {
    statusEl.textContent = 'Eroare de retea.';
  } finally {
    buttons.forEach(b => b.disabled = false);
  }
}

async function extend() {
  const btn = document.getElementById('extend-btn');
  const statusEl = document.getElementById('status');
  btn.disabled = true;
  btn.textContent = '... Turnstile ...';
  statusEl.textContent = 'Rezolv automat Turnstile...';
  try {
    const res = await fetch('/api/extend', { method: 'POST' });
    const data = await res.json();
    if (data.ok) {
      statusEl.textContent = 'Extindere reusita! +' + (data.addedMinutes || 90) + ' min.';
    } else {
      statusEl.textContent = 'Eroare: ' + (data.error || 'necunoscuta');
    }
    btn.textContent = '+ 90 MIN (AUTO)';
    btn.disabled = false;
    setTimeout(checkStatus, 2000);
  } catch (e) {
    statusEl.textContent = 'Eroare de retea la extindere.';
    btn.textContent = '+ 90 MIN (AUTO)';
    btn.disabled = false;
  }
}

// Sincronizare periodica cu serverul
async function checkStatus() {
  const remainingEl = document.getElementById('remaining');
  try {
    const res = await fetch('/api/status');
    const data = await res.json();
    if (!data.ok) {
      document.getElementById('status').textContent = 'Eroare status: ' + (data.error || 'necunoscuta');
      remainingEl.innerHTML = 'eroare<span class="unit">status</span>';
      return;
    }
    if (typeof data.remainingSeconds === 'number') {
      localSeconds = data.remainingSeconds;
    }
    isOnline = !!data.online;
    renderRemaining();
    renderResources(data.resources);
  } catch (e) {
    remainingEl.innerHTML = 'eroare<span class="unit">retea</span>';
  }
}

// Sparkline pentru CPU / MEMORY / NETWORK
const sparkHistory = { cpu: [], memory: [], network: [] };
const SPARK_MAX_POINTS = 30;

function pushSparkPoint(key, value) {
  if (typeof value !== 'number' || Number.isNaN(value)) return;
  const arr = sparkHistory[key];
  arr.push(value);
  if (arr.length > SPARK_MAX_POINTS) arr.shift();
}

function drawSpark(svgId, key, color) {
  const svg = document.getElementById(svgId);
  const arr = sparkHistory[key];
  if (!svg || arr.length < 2) { if (svg) svg.innerHTML = ''; return; }

  const w = 200, h = 26;
  const max = Math.max(...arr, 1);
  const min = Math.min(...arr, 0);
  const range = (max - min) || 1;
  const step = w / (arr.length - 1);

  const points = arr.map((v, i) => {
    const x = i * step;
    const y = h - ((v - min) / range) * (h - 4) - 2;
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');

  const fillPoints = `0,${h} ${points} ${w},${h}`;

  svg.innerHTML = `
    <polygon points="${fillPoints}" fill="${color}" opacity="0.15"></polygon>
    <polyline points="${points}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"></polyline>
  `;
}

function renderResources(resources) {
  const panel = document.getElementById('res-panel');

  if (!resources || !isOnline) {
    panel.classList.remove('show');
    return;
  }

  document.getElementById('res-cpu').textContent = resources.cpu || '—';
  document.getElementById('res-memory').textContent = resources.memory || '—';
  document.getElementById('res-network').textContent = resources.network || '—';
  panel.classList.add('show');

  pushSparkPoint('cpu', resources.cpuNum);
  pushSparkPoint('memory', resources.memoryNum);
  pushSparkPoint('network', resources.networkNum ?? 0);

  drawSpark('spark-cpu', 'cpu', '#a3e635');
  drawSpark('spark-memory', 'memory', '#27e1ff');
  drawSpark('spark-network', 'network', '#ff3aa3');
}

checkStatus();
setInterval(checkStatus, 7000);
</script>
</body>
</html>
