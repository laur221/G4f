name: G4F Auto-Extend

on:
  schedule:
    - cron: '*/30 * * * *'   # la fiecare 30 de minute
  workflow_dispatch:
    inputs:
      action:
        description: 'Ce actiune sa execute?'
        required: true
        default: 'extend'
        type: choice
        options:
          - extend        # +90min x reclame (normal)
          - start         # porneste serverul de joc
          - stop          # opreste serverul de joc
          - restart       # restarteaza serverul de joc
          - renew         # RENEW & UNSUSPEND (server suspendat)
          - status        # doar citeste statusul (timp ramas, online)

concurrency:
  group: g4f-extend
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  extend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Playwright isi instaleaza singur Chromium + toate dependentele de sistem
      - name: Install deps + Chromium
        run: |
          npm ci --omit=dev || npm install --omit=dev
          sudo env PATH="$PATH" npx playwright install --with-deps chromium chromium-headless-shell

      - name: Run action
        env:
          STORAGE_STATE_B64: ${{ secrets.STORAGE_STATE_B64 }}
          SERVER_CONSOLE_URL: ${{ secrets.SERVER_CONSOLE_URL }}
          WEB_AD_MAX: '15'
          EXTEND_MINUTES: '90'
          AUTO_EXTEND_TARGET_SECONDS: '86400'
          GH_ACTION: ${{ github.event.inputs.action || 'extend' }}
        run: node extend-once.js

      # Preventeaza dezactivarea cronului dupa 60 zile de inactivitate
      # (reactivam manual daca e necesar)

      # Publica status.json (timer, online, resurse) + pastreaza repo-ul activ
      - name: Publish status.json
        if: always()
        run: |
          git config user.name "g4f-bot"
          git config user.email "bot@g4f.local"
          if [ -f status.json ]; then
            git add status.json
            git commit -m "status update [skip ci]" || echo "fara modificari"
            git push || true
          fi

      - name: Cleanup session artifacts (siguranta)
        if: always()
        run: rm -f storageState.json
