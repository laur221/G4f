name: G4F Auto-Extend

on:
  schedule:
    - cron: '*/30 * * * *'   # la fiecare 30 de minute
  workflow_dispatch: {}       # buton manual "Run workflow"

concurrency:
  group: g4f-extend
  cancel-in-progress: false

jobs:
  extend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Playwright isi instaleaza singur Chromium + toate dependentele de sistem
      - name: Install deps + Chromium
        run: |
          npm ci --omit=dev || npm install --omit=dev
          sudo env PATH="$PATH" npx playwright install --with-deps chromium chromium-headless-shell

      - name: Run extend cycle
        env:
          STORAGE_STATE_B64: ${{ secrets.STORAGE_STATE_B64 }}
          SERVER_CONSOLE_URL: ${{ secrets.SERVER_CONSOLE_URL }}
          WEB_AD_MAX: '15'
          EXTEND_MINUTES: '90'
          AUTO_EXTEND_TARGET_SECONDS: '172800'
        run: node extend-once.js

      # Preventeaza dezactivarea cronului dupa 60 zile de inactivitate
      # (reactivam manual daca e necesar)

      - name: Cleanup session artifacts (siguranta)
        if: always()
        run: rm -f storageState.json
